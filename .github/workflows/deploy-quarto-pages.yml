# Deploy Quarto site to GitHub Pages
#
# Copy this file into YOUR personal repo as:
#   .github/workflows/deploy-quarto-pages.yml
#
# Then: Settings → Pages → Source = GitHub Actions
#
# For Option A (site at repo root): leave defaults.
# For Option B (site still under sites/your-name/): set
#   working-directory: sites/jiahe-yu   # or sites/jiahan-yu

name: Deploy Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
        # Option B example:
        # working-directory: sites/jiahe-yu
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Jupyter
        run: python -m pip install jupyter nbformat

      - name: Render site
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          # Option B: path must match output under working-directory
          # path: sites/jiahe-yu/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
